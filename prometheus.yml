global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Your .NET services running on the Mac (adjust ports as you build them)
  - job_name: payment-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5000"]

  - job_name: payment-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5001"]
